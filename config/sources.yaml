# Audited company job sources.
#
# One record per canonical company. A record the Task 11 source audit verified carries the
# provider, the public list endpoint, the evidence date, and the support status that earned
# it; a record still awaiting audit stays on provider `discovery` with
# support_status NEEDS_MANUAL_REVIEW, no audit_date, and enabled: false.
sources:
- id: nvidia-workday
  company_id: nvidia
  provider: workday
  source_class: public_ats
  support_status: SUPPORTED_UNDOCUMENTED
  endpoint: https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs
  interval_minutes: 10
  tenant: nvidia
  parameters:
    applied_facets:
      workerSubType:
      - 0c40f6bd1d8f10adf6dae42e46d44a17
    scope: workerSubType = Intern (Fixed Term); Workday caps the unscoped board at total=2000
    audit_status: SUPPORTED_UNDOCUMENTED
    audit_probed_at: '2026-10-14'
    audit_evidence: Workday CXS search behind nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
    audit_notes:
    - workday adapter collected 163 postings twice with identical canonical keys across 9 page(s)
  enabled: true
  audit_date: '2026-10-14'
