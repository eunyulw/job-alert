# Audited company job sources.
#
# One record per canonical company. A record the Task 11 source audit verified carries the
# provider, the public list endpoint, the evidence date, and the support status that earned
# it; a record still awaiting audit stays on provider `discovery` with
# support_status NEEDS_MANUAL_REVIEW, no audit_date, and enabled: false.
sources:
- id: nvidia-workday
  company_id: nvidia
  provider: workday
  source_class: public_ats
  support_status: SUPPORTED_UNDOCUMENTED
  endpoint: https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs
  interval_minutes: 20
  tenant: nvidia
  parameters:
    whole_board: true
    partition_facet: jobFamilyGroup
    scope: whole board, one jobFamilyGroup at a time (over the 2,000 cap; internships tagged Regular sat outside the intern subtype, 2026-10-20)
    slow_poll_reason: a whole-board walk of 100-240 pages; 20 minutes keeps it near 12 requests a minute
  enabled: true
  audit_date: '2026-10-20'
- id: apple-apple
  company_id: apple
