# Notification filters. Every posting is ingested and stored regardless of these rules; a filter
# only decides whether a match produces an alert. `all-jobs-dry-run` matches everything and never
# notifies, so the audit and dry-run paths have a record to report against.
#
# Approved 2026-10-14 (Task 26 canary): every internship at the robotics companies; at every other
# allowlisted company (Task 29 expansion), only internships whose title names robotics, mechanical,
# or adjacent engineering work, because "every internship" at a bank or retailer is noise.
# Title keywords and employment types are ANDed inside one filter, so "intern in the title OR typed
# Intern" takes two filters; a posting matching both still produces one alert. `intern` also matches
# titles such as "Internal Tools"; that rare false positive is accepted because excluding "internal"
# would drop real internships like "Software Engineer Intern, Internal Apps". Description keywords
# were tried and dropped: company boilerplate mentions robots or hardware in nearly every posting.
# The allowlist grows through Task 29: a company joins after its source passes two clean scheduler
# cycles (see the expansion log in docs/collection-verification.md). Phase 3b (2026-10-14) put the
# robotics startups on the every-internship filters and the aerospace, automotive and industrial
# companies on the expansion filters, whose keywords gained aerospace and vehicle terms (aerodynam,
# guidance, gnc, thermal, powertrain, battery, weld, assembly, ...). `engine` is deliberately
# absent: it is a substring of "engineer". Phase 3c (2026-10-15) added nine robotics startups to
# the every-internship filters and 51 robotics-adjacent, mechanical and Fortune 500 industrial
# companies to the expansion filters. The unreachable-list pass (2026-10-15) added the companies
# that new adapters (SuccessFactors, Oracle, Rippling, Workable, BambooHR, Pinpoint, UKG) reach.
# The freehire board-catalog pass (2026-10-18) added the companies that the iCIMS, Phenom, Jibe,
# Taleo, ADP, HRM Direct and Radancy adapters reach, plus boards found on existing providers.
# The freehire fallback pass (2026-10-19) adds the provider-refused companies whose Freehire
# company feed answers ordinary HTTPS and links back to the original source posting.
# The rejected-internship scan (2026-10-20) added the generic-engineering filters, mechanical
# keywords the expansion list lacked (structures, mechanism, turbomachin, gear, ...), the intern
# spellings "coop", "co op", "fellowship" and a season with a year ("summer 20"), and title
# exclusions for the substrings that misfired ("International" contains "intern", "Promotion"
# contains "motion", "Combat" contains "mba"). Terms are trimmed, so a trailing space does nothing.
# Tesla moved from the every-internship filters to the expansion filters (2026-10-21): its board
# types HR, finance, sales and technician programs as internships too.
# The freehire feeds were removed on 2026-10-22. CMR Surgical, Ferrari, SAP, TSMC, AbbVie, ADM,
# Progressive, StoneX and Verizon left the allowlists until they have a direct source (see
# docs/unreachable-companies.md).
# The Runway match-score pass (2026-10-22) added 15 robotics startups to the every-internship
# filters and 69 engineering, industrial, medical and aerospace employers to the expansion
# filters, all from the user's top 1,000 Runway matches.
# Every alerting filter is US-only (2026-10-14): a posting alerts only when at least one of its
# locations is confidently in the US (job_alert/geo.py); an unknown or missing location does not.
# Both filters name their companies, so they are a canary under the 90% broad-activation gate. See
# src/job_alert/filters.py for the criteria order and vocabulary.
filters:
  - id: all-jobs-dry-run
    enabled: true
    notify: false
    include_companies: []
    include_title_keywords: []
    exclude_title_keywords: []
    include_locations: []
    workplace_types: []
    categories: []
    departments: []
    description_keywords: []
    employment_types: []
    priority: normal

