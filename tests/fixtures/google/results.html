<script>AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["93402210922046150", "Finance MBA Intern, 2027", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckZdQ1OCVLO7MP1kmoEAMrS0XzHkvGcvZ5em4ApFIQoqzEjsA9yzvguu3dwKqxuMcDVQxyHFq4f1AQXYNi2lXvWEKJlXOICkA7U7P9ynUKAlja96NR0G84PoGZdD-DA%3D%3D_V2&loc=IE&title=Finance+MBA+Intern", [null, "<ul>\n<li>Collaborate with Product Management, Engineering, Sales, Operations, and Finance teams to identify, analyze, improve, and implement financial processes and systems.<br></li>\n<li>Develop and refine our budgeting and planning processes in partnership with team leaders.<br></li>\n<li>Analyze key performance and operational as well as financial metrics (e.g., business generation, productivity metrics, other key business drivers) and identify areas for improvements.</li>\n<li>Participate in discussions and develop analytical models to support company initiatives and/or financial decisions.<br></li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Currently enrolled in a MBA degree program in the EMEA region.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>4 years of experience prior to starting the MBA.<br></li>\n<li>Relevant practical or internship experience demonstrating process engineering and analytical skills with an understanding of corporate finance concepts (e.g., credit risk, cash flow).</li>\n<li>Relevant practical or internship experience demonstrating the ability to use critical thinking skills to solve highly strategic and difficult business problems.</li>\n<li>Relevant practical or internship experience demonstrating project management, communication, and organisational skills, with the ability to drive and implement ideas in a changing environment.</li>\n<li>Currently in your penultimate/final year of education.</li>\n<li>Ability to complete a minimum 13 week full-time internship in Ireland starting in either May, June or July 2027.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Dublin, Ireland", ["Barrow St, Dublin, Ireland"], "Dublin", null, "D", "IE"]], [null, "<p>Our MBA Internship Program will immerse you into the tech industry on a high-impact team. You’ll enhance your skill set, be challenged with rigorous work, grow your network and drive meaningful change in our business. Outside of your core work, you will participate in a program that exposes you to Google’s business operations, connects you with interns and Googlers, and invests in your personal and professional development.</p><div>Financial Operations (FinOps), Business Controller and Operations is responsible for almost all transactions at Google having to do with money on both, payables and receivables sides. Our systems have to be global, scalable, and ever-adapting to our new products and new regions we are entering. There are four major divisions within FinOps - Revenue to Cash Operations (RCO), Revenue Platforms (RP), Google Business Services (GBS), and Compass. As an MBA intern in any one of these teams, you will be working with large datasets and in a complex, global environment.<br></div><p>The idea for Gmail began with 1 Googler. Today it has more than 1 billion users and counting.<br><br>At Google, one Googler can make a huge impact, and it’s no different with our interns--they are key players in our daily innovation. As an intern, you’ll have the opportunity to work on projects core to Google’s business, whether it be Sales, Enterprise, Finance, People Operations (HR), Legal, Trust and Safety, or Marketing. Our intern recruitment team will determine where you fit best based on your CV and the preferences you indicate on the application form.</p><p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.</p><p>Ireland: €72000 (EUR) + 0% bonus target</p><p>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>.</p>"], [3], [1790946563, 56000000], [1791205800, 994000000], [1791205801, 80000000], [null, "<p>Please complete your application before <b>November 13, 2026</b>. We encourage you to apply as early as possible as we review applications on a rolling basis.</p><div>This internship is intended for students enrolled in their penultimate/final year of education in an accredited MBA degree program located in the EMEA region. Participation in the internship program requires that you are located in Ireland for the duration of the internship program. Interns will be required to be available to work full-time for a minimum of 13 weeks over the Summer 2027 (starting in May, June or July) for the duration of the program. Individuals applying for this position will not be eligible for immigration sponsorship.<br><br>Timing on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about an application, we likely proceeded with other candidates for that particular role. However, our recruiters might reach out if we find a different potential match for your skills, interests, and experience.</div><div><br>To start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):<br><ol><li>In the “Resume Section:” attach an updated CV or resume</li><li>In the “Education Section:” attach a current or recent unofficial or official transcript in English.</li><li>Under “Degree Status,” select “Now attending” to upload a transcript.</li></ol>Please include your expected graduation date (month and year), and availability for the internship on your resume. The specific team and project(s) will be determined based on your educational background, interest and skills.</div>"], null, null, [null, ""], [null, "<ul>\n<li>Currently enrolled in a MBA degree program in the EMEA region.</li>\n</ul>"], 5], ["115691171337904838", "Forward Deployed Engineer Intern, 2027", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckTBli2WLPcrxAJ5x1_yqcWLPdxWZIu5yUjxRAxq75PxIEjsA9yzvgmHOV4kDIlVQHRrd0KRsRQLrubaeBp9LauLHFZhy-N9Pr9-MNCXAQq4V2wmnQZratAgnVSvwPw%3D%3D_V2&loc=SG&title=Forward+Deployed+Engineer+Intern", [null, "<ul>\n<li>Serve as a developer for complex applications, transitioning from rapid prototypes to production-grade agentic workflows (e.g., multi-agent systems) and robust cloud-based software solutions. Write high-quality product or system development code, and actively participate in code reviews to ensure best practices in accuracy, testability, style, and efficiency.</li>\n<li>Design and code the connective tissue (APIs, data pipelines, security perimeters) to integrate Google’s AI and cloud technologies with live enterprise infrastructure.</li>\n<li>Collaborate closely with customer engineering teams to instill Google-grade software development best practices, ensuring long-term system adoption.</li>\n<li>Identify repeatable field patterns and technical barriers, converting real-world insights into formal product feature requests and reusable modules for our Core Engineering teams.</li>\n<li>Manage project priorities, deadlines, and deliverables while remaining enthusiastic about taking on full-stack roadblocks or infrastructure challenges.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li><div><div>Currently pursuing a Bachelor's or Master's degree in Computer Science, Engineering, or a related technical field.</div></div></li>\n<li>Enrolled in the penultimate academic year of a Bachelor’s or Master’s degree.</li>\n<li>Experience with software development in one or more programming languages (e.g., Python, C, C++, Java, JavaScript).</li>\n<li>Relevant practical or internship based experience building and executing structured/unstructured data pipelines, cloud platform databases, or AI/ML-driven workflows (such as RAG architectures).</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience developing accessible technologies.</li>\n<li>Experience with backend system development and modern coding environments (e.g., Go, Rust, Java, or ML pipelines in Python).</li>\n<li>Practical experience implementing multi-agent orchestration frameworks (e.g., LangGraph, CrewAI, ADK) or optimized state management / granular tracing.</li>\n<li>Knowledge of Large Language Model (LLM) native metrics (e.g., tokens/sec, cost-per-request) and techniques for optimizing state management and granular tracing.</li>\n<li>Outstanding technical communication skills with an interest in leading technical discovery and collaborative workshops.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Singapore", ["Singapore"], null, null, null, "SG"]], [null, "<p>It’s an exciting time to join our Google Cloud Consulting team, leading the AI and cloud revolution for businesses worldwide. In this role, you’ll work hand-in-hand with our customers as an embedded builder, bridging the gap between frontier AI products and production-grade reality. We are looking for early-career, high-agency engineers with a founder’s mindset. Moving beyond high-level architecture, you will code, debug, and jointly ship bespoke agentic solutions directly within customer environments while helping solve integration, data readiness, and state-management challenges. Joining a collaborative culture with direct access to Google's engineering minds, you will act as an innovator-builder, providing white-glove deployment of complex AI systems and serving as a critical feedback loop to shape Google Cloud’s future product roadmap.</p><div><div>Join us for a unique 10-12 week paid internship that offers personal and professional development, an executive speaker series, and community-building. </div></div><div><div><div><div><br></div></div></div></div><p>Google Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.</p>"], [2, 3], [1791882498, 67000000], [1791882498, 67000000], [1791882498, 142000000], [null, "<div>Applications will be reviewed on a rolling basis and it’s in the candidate’s best interest to apply early. The anticipated application window is open from October 13 - November 15, 2026, but may close earlier if all available projects are full. Applications submitted after the application window or once role is closed/projects are full will not be considered.</div><div><br>Participation in the internship program requires that you are located in Singapore for the duration of the internship program.<br><br>Google is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship program.</div><div><p>Google will be prioritizing applicants who have a current right to work in Singapore, and do not require Google's sponsorship of a visa.</p></div>"], null, null, [null, ""], [null, "<ul>\n<li><div><div>Currently pursuing a Bachelor's or Master's degree in Computer Science, Engineering, or a related technical field.</div></div></li>\n<li>Enrolled in the penultimate academic year of a Bachelor’s or Master’s degree.</li>\n<li>Experience with software development in one or more programming languages (e.g., Python, C, C++, Java, JavaScript).</li>\n<li>Relevant practical or internship based experience building and executing structured/unstructured data pipelines, cloud platform databases, or AI/ML-driven workflows (such as RAG architectures).</li>\n</ul>"], 5]], null, 2, 20], sideChannel: {}});</script>
</body></html>
