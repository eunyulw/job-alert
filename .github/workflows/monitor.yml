# Runs the monitor on GitHub's runners, so alerts keep coming while the laptop sleeps.
#
# Each run drives the scheduler for 50 minutes. A run is scheduled every 30 minutes and the
# concurrency group queues it behind the one in progress, so the next run starts as soon as the
# current one ends and polling stays continuous. The SQLite state travels between runs in the
# Actions cache; if the cache is ever evicted, the next run starts fresh and the first complete
# snapshot of each source seeds silently instead of announcing every open posting.
#
# Alerts go to ntfy (secrets NTFY_TOPIC_URL and NTFY_ACCESS_TOKEN). The openings page is pushed to
# the gh-pages branch every 10 minutes and served by GitHub Pages.
name: monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      STATE_DIR: state
      SITE_DIR: site
      NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
      NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monitor-state-

      - name: Run the scheduler for 50 minutes
        run: |
          mkdir -p "$STATE_DIR" "$SITE_DIR"
          publish() {
            [ -f "$SITE_DIR/index.html" ] || return 0
            page=$(mktemp -d)
            cp "$SITE_DIR"/*.html "$page"/ && touch "$page/.nojekyll"
            git -C "$page" init -q -b gh-pages
            git -C "$page" add -A
            git -C "$page" -c user.name="job-alert-monitor" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Openings page $(date -u +%FT%TZ)"
            # One orphan commit, force-pushed, so the branch never accumulates page history.
            git -C "$page" push -qf \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
            rm -rf "$page"
          }
          uv run job-alert run \
            --mode live \
            --provider ntfy \
            --config config \
            --db "$STATE_DIR/job-alert.sqlite3" \
            --digest-report "$SITE_DIR/daily-digest.md" \
            --openings-page "$SITE_DIR/index.html" \
            --stop-after-minutes 50 &
          monitor=$!
          elapsed=0
          while kill -0 "$monitor" 2>/dev/null; do
            sleep 30
            elapsed=$((elapsed + 30))
            if [ $((elapsed % 600)) -eq 0 ]; then publish || echo "page publish failed"; fi
          done
          status=0
          wait "$monitor" || status=$?
          publish || echo "page publish failed"
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
